[project]
name = "ragu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "fastmcp>=3.4.4",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "jinja2>=3.1.6",
    "langchain-mcp-adapters>=0.3.0",
    "langfuse>=4.13.2",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "openai>=2.44.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragu", "ricettario"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.0",
    "pandas>=3.0.4",
    "pyarrow>=24.0.0",
    "ragas>=0.4.3",
    "wordcloud>=1.9.6",
]
