[project]
name = "ragu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cohere>=7.0.5",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "jinja2>=3.1.6",
    "langsmith>=0.9.4",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.0",
    "pandas>=3.0.4",
    "pyarrow>=24.0.0",
    "ragas>=0.4.3",
    "wordcloud>=1.9.6",
]
